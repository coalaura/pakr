name: test

on:
  push:
    branches: ["**"]
  workflow_call:

permissions:
  contents: read

jobs:
  references:
    name: Generate independent reference fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Cache source archives
        uses: actions/cache@v6
        with:
          path: .native/downloads
          key: native-sources-v2-${{ hashFiles('scripts/native.lock') }}
          restore-keys: native-sources-v2-

      - name: Restore native libraries
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: .native/linux-amd64
          key: native-v2-linux-amd64-${{ hashFiles('scripts/native.sh', 'scripts/native-recipes.sh', 'scripts/native.lock', 'scripts/fetch.sh', 'scripts/patches/*.patch', 'scripts/*/CMakeLists.txt', 'tools/toolchain/*.go', 'tools/toolchain/go.mod', 'tools/toolchain/go.sum', 'internal/native/parallel/**', 'internal/native/parallel.h', 'internal/native/kanzi/**', 'internal/native/kanzi.h', 'internal/native/wim/**', 'internal/native/wim.h') }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: native-v2-linux-amd64-

      - name: Generate reference fixtures
        env:
          BUILD_IMAGE: coalaura/builder:latest
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            --env BUILD_IMAGE --env JOBS=4 --env CI=true --env GOEXPERIMENT=cgocheck2 \
            --env HOST_UID="$(id -u)" --env HOST_GID="$(id -g)" \
            --entrypoint sh "$BUILD_IMAGE" -ec '
              mkdir -p .native dist
              trap '\''chown -R "$HOST_UID:$HOST_GID" .native dist'\'' EXIT
              apk add --no-cache build-base cmake coreutils curl patch tar xz gzip zstd bzip2 lzip lz4 brotli libarchive-tools cpio xorriso binutils pkgconf
              for tool in cpio xorriso gzip uncompress xz bsdtar ar pkg-config; do
                command -v "$tool"
              done
              cpio --version | grep -q "GNU cpio"
              ar --version | grep -q "GNU ar"
              bash scripts/fetch_test.sh
              bash scripts/native_test.sh
              export JOBS=$(bash scripts/native-jobs.sh)
              bash scripts/native.sh linux amd64
              cmake -S .native/src/bzip3 -B .native/build/bzip3-cli \
                -DCMAKE_TOOLCHAIN_FILE="$PWD/.native/build/linux-amd64/toolchain/toolchain.cmake" \
                -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
                -DBZIP3_BUILD_APPS=ON -DBZIP3_ENABLE_PTHREAD=ON -DBZIP3_ENABLE_ARCH_NATIVE=OFF
              cmake --build .native/build/bzip3-cli --parallel "$JOBS"
              while read -r name version checksum url; do
                if [ "$name" = libbsc ]; then
                  mkdir -p .native/build/bsc-reference
                  tar -xf ".native/downloads/$name-$version.tar" --strip-components=1 -C .native/build/bsc-reference
                  break
                fi
              done < scripts/native.lock
              cmake -S .native/build/bsc-reference -B .native/build/bsc-reference/build \
                -DCMAKE_TOOLCHAIN_FILE="$PWD/.native/build/linux-amd64/toolchain/toolchain.cmake" \
                -DCMAKE_BUILD_TYPE=Release -DBSC_BUILD_SHARED_LIB=OFF \
                -DBSC_ENABLE_NATIVE_COMPILATION=OFF -DBSC_ENABLE_OPENMP=OFF -DBSC_ENABLE_CUDA=OFF
              cmake --build .native/build/bsc-reference/build --parallel "$JOBS"
              bash scripts/wimlib/reference.sh
              export PAKR_WIMLIB_IMAGEX="$PWD/.native/build/wimlib-reference/wimlib-imagex"
              export BZIP3_CLI="$PWD/.native/build/bzip3-cli/bzip3"
              export BSC_CLI="$PWD/.native/build/bsc-reference/build/bsc"
              mkdir -p dist/references dist/reference-tools
              cp "$BZIP3_CLI" dist/reference-tools/bzip3
              cp "$BSC_CLI" dist/reference-tools/bsc
              export PAKR_INTEROP_MODE=prepare
              export PAKR_INTEROP_REFERENCES="$PWD/dist/references"
              bash scripts/build.sh linux amd64 test -tags=integration -count=1 -v -run "Test(Reference|BSCCLI|Bzip3CLI|LzipCLI|XZCLI|WIMImagex)"
            '

      - name: Save updated native libraries
        if: ${{ !cancelled() && hashFiles('.native/build/linux-amd64/cache-changed') != '' && hashFiles('.native/build/linux-amd64/cache-ready') != '' }}
        uses: actions/cache/save@v6
        with:
          path: .native/linux-amd64
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Upload failed native build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-logs-references
          path: |
            .native/build/**/*.log
            .native/build/**/CMakeFiles/CMakeConfigureLog.yaml
          include-hidden-files: true
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: reference-fixtures
          path: dist/references/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: reference-tools
          path: dist/reference-tools/
          if-no-files-found: error

  test-build:
    name: Build tests (${{ matrix.os }}/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, darwin]
    steps:
      - uses: actions/checkout@v7

      - name: Cache source archives
        uses: actions/cache@v6
        with:
          path: .native/downloads
          key: native-sources-v2-${{ hashFiles('scripts/native.lock') }}
          restore-keys: native-sources-v2-

      - name: Restore native libraries
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: .native/${{ matrix.os }}-amd64
          key: native-v2-${{ matrix.os }}-amd64-${{ hashFiles('scripts/native.sh', 'scripts/native-recipes.sh', 'scripts/native.lock', 'scripts/fetch.sh', 'scripts/patches/*.patch', 'scripts/*/CMakeLists.txt', 'tools/toolchain/*.go', 'tools/toolchain/go.mod', 'tools/toolchain/go.sum', 'internal/native/parallel/**', 'internal/native/parallel.h', 'internal/native/kanzi/**', 'internal/native/kanzi.h', 'internal/native/wim/**', 'internal/native/wim.h') }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: native-v2-${{ matrix.os }}-amd64-

      - name: Compile all test packages
        env:
          PAKR_TARGET_OS: ${{ matrix.os }}
          BUILD_IMAGE: coalaura/builder:latest${{ matrix.os == 'darwin' && '-macos' || '' }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            --env PAKR_TARGET_OS --env BUILD_IMAGE --env JOBS=4 --env GOEXPERIMENT=cgocheck2 \
            --env HOST_UID="$(id -u)" --env HOST_GID="$(id -g)" \
            --entrypoint bash "$BUILD_IMAGE" -ec '
              mkdir -p .native dist
              trap '\''chown -R "$HOST_UID:$HOST_GID" .native dist'\'' EXIT
              apk add --no-cache build-base cmake coreutils curl patch tar xz
              bash scripts/native.sh "$PAKR_TARGET_OS" amd64
              source ".native/build/$PAKR_TARGET_OS-amd64/toolchain/env.sh"
              suffix=
              if [ "$PAKR_TARGET_OS" = windows ]; then suffix=.exe; fi
              module=$(go list -m)
              packages=$(go list "${GO_BUILD_FLAGS[@]}" -tags=integration -f '\''{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}'\'' ./...)
              for package in $packages; do
                directory="dist/tests${package#"$module"}"
                mkdir -p "$directory"
                go test "${GO_BUILD_FLAGS[@]}" -ldflags "$GO_LDFLAGS" -tags=integration -c -o "$directory/package.test$suffix" "$package"
              done
            '

      - name: Save updated native libraries
        if: ${{ !cancelled() && hashFiles(format('.native/build/{0}-amd64/cache-changed', matrix.os)) != '' && hashFiles(format('.native/build/{0}-amd64/cache-ready', matrix.os)) != '' }}
        uses: actions/cache/save@v6
        with:
          path: .native/${{ matrix.os }}-amd64
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Upload failed native build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-logs-test-${{ matrix.os }}-amd64
          path: |
            .native/build/**/*.log
            .native/build/**/CMakeFiles/CMakeConfigureLog.yaml
          include-hidden-files: true
          retention-days: 7

      - name: Upload test binaries
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.os }}-amd64
          path: dist/tests/
          if-no-files-found: error

  test-runtime:
    name: Tests (${{ matrix.os }}/amd64)
    needs: [test-build, references]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-2025
          - os: darwin
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: tests-${{ matrix.os }}-amd64
          path: dist/tests

      - uses: actions/download-artifact@v8
        with:
          name: reference-fixtures
          path: dist/references

      - name: Enable native Windows symlinks
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force | Out-Null

      - name: Prepare case-sensitive macOS temporary volume
        id: test-volume
        if: matrix.os == 'darwin'
        run: |
          hdiutil create -size 4g -type SPARSE -fs APFS -fsargs "-e" -volname pakr-tests "$RUNNER_TEMP/pakr-tests.sparseimage"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/pakr-tests" "$RUNNER_TEMP/pakr-tests.sparseimage"
          mkdir "$RUNNER_TEMP/pakr-tests/tmp"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP/pakr-tests/tmp" >> "$GITHUB_ENV"

      - name: Check macOS parallel gzip
        if: matrix.os == 'darwin'
        timeout-minutes: 3
        run: |
          chmod +x dist/tests/internal/native/package.test
          dist/tests/internal/native/package.test -test.v -test.run '^TestParallel' -test.count=1 -test.timeout=2m

      - name: Run all test packages
        shell: bash
        env:
          PAKR_INTEROP_MODE: platform
          PAKR_INTEROP_REFERENCES: ${{ github.workspace }}/dist/references
          PAKR_INTEROP_OUTPUTS: ${{ github.workspace }}/dist/produced
        run: |
          binaries=()
          while IFS= read -r -d '' binary; do
            binaries+=("$binary")
          done < <(find "$PWD/dist/tests" -type f -name 'package.test*' -print0)
          test "${#binaries[@]}" -gt 0
          for binary in "${binaries[@]}"; do
            chmod +x "$binary"
            package_directory=${binary%/*}
            package_directory=${package_directory#"$PWD/dist/tests"}
            (
              cd ".$package_directory"
              "$binary" -test.v -test.count=1 -test.timeout=10m
            )
          done

      - uses: actions/upload-artifact@v7
        with:
          name: produced-${{ matrix.os }}-amd64
          path: dist/produced/
          if-no-files-found: error

      - name: Detach macOS temporary volume
        if: always() && matrix.os == 'darwin' && steps.test-volume.outcome == 'success'
        run: hdiutil detach "$RUNNER_TEMP/pakr-tests"

  verify:
    name: Independently verify ${{ matrix.os }} output
    needs: [references, test-build, test-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, darwin]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: tests-linux-amd64
          path: dist/tests

      - uses: actions/download-artifact@v8
        with:
          name: reference-fixtures
          path: dist/references

      - uses: actions/download-artifact@v8
        with:
          name: reference-tools
          path: dist/reference-tools

      - uses: actions/download-artifact@v8
        with:
          name: produced-${{ matrix.os }}-amd64
          path: dist/produced

      - name: Verify every expected platform output
        env:
          PAKR_INTEROP_OS: ${{ matrix.os }}
          BUILD_IMAGE: coalaura/builder:latest
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            --env PAKR_INTEROP_OS --env CI=true \
            --entrypoint sh "$BUILD_IMAGE" -ec '
              apk add --no-cache xz gzip zstd bzip2 lzip lz4 brotli libarchive-tools cpio xorriso binutils
              for tool in cpio xorriso gzip uncompress xz bsdtar ar; do
                command -v "$tool"
              done
              cpio --version | grep -q "GNU cpio"
              ar --version | grep -q "GNU ar"
              chmod +x dist/reference-tools/* dist/tests/internal/native/package.test dist/tests/internal/pak/package.test
              export BZIP3_CLI="$PWD/dist/reference-tools/bzip3"
              export BSC_CLI="$PWD/dist/reference-tools/bsc"
              export PAKR_INTEROP_MODE=verify
              export PAKR_INTEROP_REFERENCES="$PWD/dist/references"
              export PAKR_INTEROP_OUTPUTS="$PWD/dist/produced"
              root=$PWD
              for package in internal/native internal/pak; do
                (cd "$package" && "$root/dist/tests/$package/package.test" -test.v -test.count=1 -test.timeout=10m -test.run "Test(Reference|BSCCLI|Bzip3CLI|LzipCLI|XZCLI)")
              done
            '
