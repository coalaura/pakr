name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    name: ${{ matrix.os }}/${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Cache source archives
        uses: actions/cache@v6
        with:
          path: .native/downloads
          key: native-sources-v2-${{ hashFiles('scripts/native.lock') }}
          restore-keys: native-sources-v2-

      - name: Restore native libraries
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: .native/${{ matrix.os }}-${{ matrix.arch }}
          key: native-v2-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/native.sh', 'scripts/native-recipes.sh', 'scripts/native.lock', 'scripts/fetch.sh', 'scripts/patches/*.patch', 'scripts/*/CMakeLists.txt', 'tools/toolchain/*.go', 'tools/toolchain/go.mod', 'tools/toolchain/go.sum', 'internal/native/parallel/**', 'internal/native/parallel.h', 'internal/native/kanzi/**', 'internal/native/kanzi.h', 'internal/native/wim/**', 'internal/native/wim.h') }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: native-v2-${{ matrix.os }}-${{ matrix.arch }}-

      - name: Build native libraries
        env:
          PAKR_TARGET_OS: ${{ matrix.os }}
          PAKR_TARGET_ARCH: ${{ matrix.arch }}
          BUILD_IMAGE: coalaura/builder:latest${{ matrix.os == 'darwin' && '-macos' || '' }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            --env PAKR_TARGET_OS --env PAKR_TARGET_ARCH --env BUILD_IMAGE --env JOBS=4 \
            --env HOST_UID="$(id -u)" --env HOST_GID="$(id -g)" \
            --entrypoint sh "$BUILD_IMAGE" -ec '
              mkdir -p .native dist
              trap '\''chown -R "$HOST_UID:$HOST_GID" .native dist'\'' EXIT
              apk add --no-cache build-base cmake coreutils curl patch tar xz
              bash scripts/native.sh "$PAKR_TARGET_OS" "$PAKR_TARGET_ARCH"
              if [ "$PAKR_TARGET_OS/$PAKR_TARGET_ARCH" = linux/amd64 ]; then
                bash scripts/source.sh "${{ github.ref_name }}"
              fi
            '

      - name: Save updated native libraries
        if: ${{ !cancelled() && hashFiles(format('.native/build/{0}-{1}/cache-changed', matrix.os, matrix.arch)) != '' && hashFiles(format('.native/build/{0}-{1}/cache-ready', matrix.os, matrix.arch)) != '' }}
        uses: actions/cache/save@v6
        with:
          path: .native/${{ matrix.os }}-${{ matrix.arch }}
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Upload failed native build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-logs-release-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            .native/build/**/*.log
            .native/build/**/CMakeFiles/CMakeConfigureLog.yaml
          include-hidden-files: true
          retention-days: 7

      - name: Upload corresponding source
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v7
        with:
          name: pakr-corresponding-source
          path: dist/pakr-source-*.tar.gz
          if-no-files-found: error

      - name: Build
        id: build
        uses: coalaura/build@v1
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
          cgo: true
          optimization: compatible
          generate: false
          output: dist/pakr-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }}
          go-flags: |
            -ldflags=-X main.version=${{ github.ref_name }}

      - name: Sign
        id: sign
        uses: coalaura/sign@v1
        with:
          path: ${{ steps.build.outputs.path }}
          key: ${{ secrets.COALAURA_PFX }}
          passphrase: ${{ secrets.COALAURA_PFX_PASSWORD }}
          chain: |
            https://wiese2.org/pki/issuing.pem
            https://wiese2.org/pki/root.pem

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: signed-pakr-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ steps.sign.outputs.path }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: signed-pakr-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -b pakr-* > SHA256SUMS

      - name: Attest binaries
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Download corresponding source
        uses: actions/download-artifact@v8
        with:
          name: pakr-corresponding-source
          path: dist

      - name: Checksum corresponding source
        working-directory: dist
        run: sha256sum -b pakr-source-*.tar.gz > SOURCE_SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/pakr-*
            dist/SHA256SUMS
            dist/SOURCE_SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          token: ${{ secrets.GITHUB_TOKEN }}
