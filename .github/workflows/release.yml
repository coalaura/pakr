name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Cache native dependencies
        uses: actions/cache@v5
        with:
          path: |
            .native/downloads
            .native/${{ matrix.os }}-${{ matrix.arch }}
          key: native-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/**', 'tools/toolchain/**', 'internal/native/parallel/**', 'internal/native/parallel.h') }}

      - name: Build native libraries
        env:
          PAKR_TARGET_OS: ${{ matrix.os }}
          PAKR_TARGET_ARCH: ${{ matrix.arch }}
          BUILD_IMAGE: coalaura/builder:latest${{ matrix.os == 'darwin' && '-macos' || '' }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            --env PAKR_TARGET_OS --env PAKR_TARGET_ARCH --env JOBS=2 \
            --env HOST_UID="$(id -u)" --env HOST_GID="$(id -g)" \
            --entrypoint sh "$BUILD_IMAGE" -ec '
              apk add --no-cache build-base cmake coreutils curl patch tar xz
              bash scripts/native.sh "$PAKR_TARGET_OS" "$PAKR_TARGET_ARCH"
              if [ "$PAKR_TARGET_OS/$PAKR_TARGET_ARCH" = linux/amd64 ]; then
                bash scripts/build.sh linux amd64 test
              fi
              chown -R "$HOST_UID:$HOST_GID" .native
            '

      - name: Build
        id: build
        uses: coalaura/build@v1
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
          cgo: true
          optimization: compatible
          generate: false
          output: dist/pakr-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }}
          go-flags: |
            -ldflags=-X main.version=${{ github.ref_name }}

      - name: Sign
        id: sign
        uses: coalaura/sign@v1
        with:
          path: ${{ steps.build.outputs.path }}
          key: ${{ secrets.COALAURA_PFX }}
          passphrase: ${{ secrets.COALAURA_PFX_PASSWORD }}
          chain: |
            https://wiese2.org/pki/issuing.pem
            https://wiese2.org/pki/root.pem

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: signed-pakr-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ steps.sign.outputs.path }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: signed-pakr-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -b pakr-* > SHA256SUMS

      - name: Attest binaries
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/pakr-*
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          token: ${{ secrets.GITHUB_TOKEN }}
